<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokédex GO — Coleção</title>
<style>
:root{--bg:#0b1018;--card:#121925;--line:#243044;--text:#eef4ff;--muted:#8e9db3;--on:#2f80ed;--on2:#56ccf2;--green:#27ae60}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(11,16,24,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.wrap{max-width:1180px;margin:auto;padding:14px 16px}.top{display:flex;gap:12px;align-items:center}.title{font-size:20px;font-weight:800;white-space:nowrap}.search{width:100%;border:1px solid var(--line);background:#0e1520;color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;outline:none}.search:focus{border-color:#416da8}
.filters{display:grid;grid-template-columns:1fr 180px 160px;gap:7px;margin-top:8px}.select{border:1px solid var(--line);background:#0e1520;color:var(--text);border-radius:10px;padding:8px 10px;font-size:12px;outline:none}.summary{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#0e1520;border-radius:999px;padding:5px 9px;font-size:11px;color:var(--muted)}.pill b{color:var(--text)}
main{max-width:1180px;margin:auto;padding:10px 16px 70px}.headrow{display:none}#app{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.row{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 7px;min-height:42px}.monid{display:flex;align-items:center;gap:5px;min-width:132px;max-width:132px}.sprite{width:34px;height:34px;object-fit:contain;image-rendering:auto;flex:0 0 34px}.montext{min-width:0;display:flex;align-items:center;gap:5px}.checks{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-width:0}.dex{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.pokemon{min-width:0;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{height:25px;border:1px solid #334158;background:#0e1520;color:#718097;border-radius:6px;font-size:9px;font-weight:800;cursor:pointer;padding:0 5px}.check:hover{border-color:#57749c}.check.on{background:linear-gradient(135deg,var(--on),var(--on2));border-color:transparent;color:#fff}.check.mega{border-color:#6a4a88;color:#b998d5}.check.mega.on{background:linear-gradient(135deg,#7250a4,#b05bd0);color:#fff}.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)}
@media(max-width:900px){.wrap{padding:10px}.top{align-items:stretch;flex-direction:column;gap:7px}.title{font-size:17px}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.summary{margin-top:6px}main{padding:8px}#app{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}}
@media(max-width:560px){.filters{grid-template-columns:1fr 1fr}#app{grid-template-columns:1fr}.row{min-height:0}.monid{min-width:126px;max-width:126px}.sprite{width:32px;height:32px;flex-basis:32px}.pokemon{font-size:12px}.dex{font-size:10px}.check{font-size:9px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><div class="title">Pokédex GO</div></div>
  <div class="filters">
    <input id="q" class="search" type="search" placeholder="Buscar Pokémon ou número...">
    <select id="region" class="select"><option value="all">Todas as regiões</option><option value="kanto">Kanto</option><option value="johto">Johto</option><option value="hoenn">Hoenn</option><option value="sinnoh">Sinnoh</option><option value="unova">Unova</option><option value="kalos">Kalos</option><option value="alola">Alola</option><option value="galar">Galar</option><option value="hisui">Hisui</option><option value="paldea">Paldea</option></select>
    <select id="rarity" class="select"><option value="all">Todos</option><option value="legendary">Lendários</option><option value="mythical">Míticos</option></select>
  </div>
  <div class="summary"><span class="pill">Pokémon: <b id="totalMons">0</b></span><span class="pill">com algo marcado: <b id="markedMons">0</b></span><span class="pill">marcações: <b id="marks">0</b></span></div>
</div></header>
<main>
  <div class="headrow"><div>#</div><div class="pokemon">Pokémon</div><div>Normal</div><div>Brilhante</div><div>100%</div><div>XXS</div><div>XXL</div><div>Sortudo</div><div>Sombroso</div><div>Purificado</div><div>Mega</div></div>
  <div id="app"><div class="empty">Carregando Pokédex...</div></div>
</main>
<script>
const MAX_DEX=1025;
const STORE='pogoDexSimple.v1';
const CACHE='pogoDexSimpleSpecies.v1';
const FIELDS=[
  ['normal','Normal'],['shiny','Brilhante'],['hundo','100%'],['xxs','XXS'],['xxl','XXL'],['lucky','Sortudo'],['shadow','Sombroso'],['purified','Purificado'],['mega','Mega']
];
// Espécies com Mega em Pokémon GO / universo atual usado pelo app.
const MEGA_IDS=new Set([
3,6,9,15,18,26,36,65,71,80,94,115,121,127,130,142,149,150,154,160,181,208,212,214,227,229,248,
254,257,260,282,302,303,306,308,310,319,323,334,354,358,359,362,373,376,380,381,384,
428,445,448,460,475,531,719,720
]);

const REGION_RANGES={
  kanto:[1,151],johto:[152,251],hoenn:[252,386],sinnoh:[387,493],unova:[494,649],
  kalos:[650,721],alola:[722,809],galar:[810,898],hisui:[899,905],paldea:[906,1025]
};
const LEGENDARY_IDS=new Set([144,145,146,150,243,244,245,249,250,377,378,379,380,381,382,383,384,480,481,482,483,484,485,486,487,488,638,639,640,641,642,643,644,645,646,716,717,718,772,773,785,786,787,788,789,790,791,792,800,888,889,890,891,892,894,895,896,897,898,1001,1002,1003,1004,1007,1008,1014,1015,1016,1017,1024]);
const MYTHICAL_IDS=new Set([151,251,385,386,489,490,491,492,493,494,647,648,649,719,720,721,801,802,807,808,809,893,1025]);

const app=document.getElementById('app'), q=document.getElementById('q'), region=document.getElementById('region'), rarity=document.getElementById('rarity');
let mons=[];
let state=JSON.parse(localStorage.getItem(STORE)||'{}');
state.have ||= {};
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
const clean=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const nice=s=>s.split('-').map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(' ');
function migrate(){
  if(localStorage.getItem('pogoDexSimpleMigrated.v1')) return;
  try{
    const old=JSON.parse(localStorage.getItem('pogoDexChecklist.v2')||'{}');
    const owned=old.owned||{};
    Object.keys(owned).forEach(k=>{
      if(!owned[k]) return;
      const [id,variant]=k.split('|');
      if(!id) return;
      state.have[id] ||= {};
      if(variant==='normal') state.have[id].normal=true;
      if(variant==='shadow') state.have[id].shadow=true;
      if(variant==='purified') state.have[id].purified=true;
    });
    save(); localStorage.setItem('pogoDexSimpleMigrated.v1','1');
  }catch(e){}
}
migrate();
function countSummary(){
  let markedMons=0, marks=0;
  Object.values(state.have).forEach(o=>{const n=Object.values(o).filter(Boolean).length;if(n){markedMons++;marks+=n}});
  document.getElementById('totalMons').textContent=mons.length;
  document.getElementById('markedMons').textContent=markedMons;
  document.getElementById('marks').textContent=marks;
}
function render(){
  const query=clean(q.value.trim());
  const visible=mons.filter(p=>{
    const have=state.have[p.id]||{};
    const applicable=FIELDS.filter(([key])=>key!=='mega'||MEGA_IDS.has(p.id));
    const complete=applicable.every(([key])=>have[key]);
    if(complete) return false;
    if(region.value!=='all'){const range=REGION_RANGES[region.value]; if(!range || p.id<range[0] || p.id>range[1]) return false;}
    if(rarity.value==='legendary'&&!LEGENDARY_IDS.has(p.id)) return false;
    if(rarity.value==='mythical'&&!MYTHICAL_IDS.has(p.id)) return false;
    return !query||clean(`${p.id} ${p.name}`).includes(query);
  });
  countSummary();
  if(!visible.length){app.innerHTML=`<div class="empty">${query?'Nenhum Pokémon encontrado.':'Tudo completo.'}</div>`;return;}
  app.innerHTML=visible.map(p=>{
    const have=state.have[p.id]||{};
    const buttons=FIELDS.map(([key,label])=>{
      if(key==='mega'&&!MEGA_IDS.has(p.id)) return '';
      if(have[key]) return '';
      return `<button class="check ${key==='mega'?'mega ':''}" data-id="${p.id}" data-key="${key}" title="${label}">${label}</button>`;
    }).join('');
    return `<div class="row"><div class="monid"><img class="sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png" alt="" loading="lazy" onerror="this.style.display='none'"><div class="montext"><div class="dex">#${String(p.id).padStart(4,'0')}</div><div class="pokemon">${p.name}</div></div></div><div class="checks">${buttons}</div></div>`;
  }).join('');
}
app.addEventListener('click',e=>{
  const b=e.target.closest('button[data-id]'); if(!b)return;
  const id=b.dataset.id,key=b.dataset.key;
  state.have[id] ||= {};
  state.have[id][key]=true;
  save();
  render();
});
q.addEventListener('input',render);
region.addEventListener('change',render);
rarity.addEventListener('change',render);
async function load(){
  try{
    const cached=localStorage.getItem(CACHE);
    if(cached){mons=JSON.parse(cached);render();return;}
    const r=await fetch(`https://pokeapi.co/api/v2/pokemon-species?limit=${MAX_DEX}`);
    if(!r.ok) throw new Error('Falha');
    const d=await r.json();
    mons=d.results.map((x,i)=>({id:i+1,name:nice(x.name)}));
    localStorage.setItem(CACHE,JSON.stringify(mons)); render();
  }catch(e){app.innerHTML='<div class="empty">Não consegui carregar a Pokédex. Abra com internet na primeira vez.</div>';}
}
load();
</script>
</body>
</html>

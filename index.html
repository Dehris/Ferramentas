<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Ferramentas</title>
  <style>
    :root{
      --bg:#0b0d12;
      --panel:#12151d;
      --panel-2:#171b24;
      --text:#f4f6fb;
      --muted:#8f98aa;
      --line:#252b37;
      --accent:#7c5cff;
      --accent-2:#9b87ff;
      --shadow:0 14px 40px rgba(0,0,0,.22);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(124,92,255,.12), transparent 28rem),
        var(--bg);
      color:var(--text);
    }

    .wrap{
      width:min(1180px, calc(100% - 28px));
      margin:0 auto;
      padding:34px 0 60px;
    }

    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
      margin-bottom:26px;
    }

    .brand small{
      display:block;
      color:var(--accent-2);
      font-size:.76rem;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
      margin-bottom:7px;
    }

    h1{
      margin:0;
      font-size:clamp(2rem, 6vw, 4rem);
      line-height:.95;
      letter-spacing:-.055em;
    }

    .subtitle{
      margin:10px 0 0;
      color:var(--muted);
      font-size:.95rem;
    }

    .count{
      min-width:92px;
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(18,21,29,.78);
      color:var(--muted);
      text-align:center;
      font-size:.78rem;
    }

    .count strong{
      display:block;
      color:var(--text);
      font-size:1.25rem;
      margin-bottom:2px;
    }

    .toolbar{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      margin-bottom:18px;
      position:sticky;
      top:10px;
      z-index:20;
    }

    .search{
      position:relative;
    }

    .search input{
      width:100%;
      border:1px solid var(--line);
      background:rgba(18,21,29,.92);
      color:var(--text);
      border-radius:15px;
      padding:14px 16px 14px 43px;
      outline:none;
      font-size:.95rem;
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .search input:focus{
      border-color:var(--accent);
    }

    .search .icon{
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      color:var(--muted);
      pointer-events:none;
    }

    .filters{
      display:flex;
      gap:8px;
    }

    .filter{
      border:1px solid var(--line);
      background:rgba(18,21,29,.92);
      color:var(--muted);
      padding:0 14px;
      border-radius:15px;
      font-weight:700;
      cursor:pointer;
    }

    .filter.active{
      color:#fff;
      border-color:rgba(124,92,255,.65);
      background:rgba(124,92,255,.18);
    }

    .section-title{
      margin:28px 2px 12px;
      color:#c6ccda;
      font-size:.78rem;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:12px;
    }

    .card{
      display:flex;
      flex-direction:column;
      min-height:170px;
      padding:18px;
      border:1px solid var(--line);
      border-radius:20px;
      background:linear-gradient(180deg, rgba(23,27,36,.96), rgba(18,21,29,.96));
      color:inherit;
      text-decoration:none;
      transition:.18s ease;
      overflow:hidden;
      position:relative;
    }

    .card::after{
      content:"";
      position:absolute;
      width:120px;
      height:120px;
      border-radius:50%;
      background:rgba(124,92,255,.10);
      right:-50px;
      top:-55px;
      transition:.18s ease;
    }

    .card:hover{
      transform:translateY(-3px);
      border-color:#3a4353;
      box-shadow:var(--shadow);
    }

    .card:hover::after{
      transform:scale(1.25);
      background:rgba(124,92,255,.16);
    }

    .card-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:24px;
      position:relative;
      z-index:2;
    }

    .app-icon{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border-radius:13px;
      background:#202635;
      border:1px solid #2e3646;
      font-size:1.25rem;
    }

    .tag{
      font-size:.68rem;
      font-weight:800;
      color:#b7adff;
      background:rgba(124,92,255,.13);
      border:1px solid rgba(124,92,255,.22);
      padding:6px 8px;
      border-radius:999px;
    }

    .card h2{
      margin:0 0 6px;
      font-size:1.08rem;
      letter-spacing:-.02em;
      position:relative;
      z-index:2;
    }

    .card p{
      margin:0;
      color:var(--muted);
      font-size:.84rem;
      line-height:1.45;
      position:relative;
      z-index:2;
    }

    .open{
      margin-top:auto;
      padding-top:18px;
      color:#d8d3ff;
      font-size:.79rem;
      font-weight:800;
      position:relative;
      z-index:2;
    }

    .empty{
      grid-column:1/-1;
      border:1px dashed var(--line);
      border-radius:18px;
      padding:28px;
      text-align:center;
      color:var(--muted);
      display:none;
    }

    footer{
      margin-top:36px;
      padding-top:18px;
      border-top:1px solid var(--line);
      color:#687185;
      font-size:.75rem;
      display:flex;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    @media (max-width:780px){
      .wrap{
        width:min(100% - 20px, 700px);
        padding-top:22px;
      }

      header{
        align-items:flex-start;
      }

      .count{
        min-width:76px;
      }

      .toolbar{
        grid-template-columns:1fr;
        position:static;
      }

      .filters{
        overflow:auto;
        padding-bottom:2px;
      }

      .filter{
        min-height:40px;
        white-space:nowrap;
      }

      .grid{
        grid-template-columns:repeat(2, minmax(0,1fr));
      }

      .card{
        min-height:150px;
        padding:15px;
        border-radius:17px;
      }
    }

    @media (max-width:500px){
      h1{font-size:2.55rem}
      .subtitle{font-size:.85rem}
      .grid{grid-template-columns:1fr}
      .card{min-height:138px}
      .card-top{margin-bottom:16px}
    }
  
    .category-card{
      width:100%;
      text-align:left;
      font:inherit;
      cursor:pointer;
    }

    .category-head{
      display:flex;
      align-items:center;
      gap:16px;
      margin:8px 0 18px;
    }

    .category-title{
      margin:0;
      font-size:1.75rem;
      letter-spacing:-.035em;
    }

    .back-btn,
    .add-tool-btn,
    .secondary-btn,
    .primary-btn,
    .modal-close{
      border:1px solid var(--line);
      border-radius:14px;
      font:inherit;
      font-weight:800;
      cursor:pointer;
    }

    .add-tool-btn{
      background:var(--accent);
      color:white;
      padding:12px 16px;
      white-space:nowrap;
    }

    .back-btn,
    .secondary-btn{
      background:var(--panel);
      color:var(--text);
      padding:10px 13px;
    }

    .primary-btn{
      background:var(--accent);
      color:#fff;
      padding:10px 16px;
    }

    .category-search{
      margin-bottom:14px;
    }

    .modal-backdrop{
      position:fixed;
      inset:0;
      z-index:100;
      background:rgba(0,0,0,.66);
      padding:18px;
      display:grid;
      place-items:center;
    }

    .modal-backdrop[hidden]{
      display:none;
    }

    .modal{
      width:min(520px,100%);
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:22px;
      padding:20px;
      box-shadow:var(--shadow);
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:15px;
      margin-bottom:18px;
    }

    .modal-head h2{
      margin:0;
    }

    .modal-close{
      width:38px;
      height:38px;
      background:var(--panel-2);
      color:var(--text);
      font-size:1.4rem;
    }

    .modal form{
      display:grid;
      gap:13px;
    }

    .modal label{
      display:grid;
      gap:6px;
      color:var(--muted);
      font-size:.8rem;
      font-weight:800;
    }

    .modal input,
    .modal select{
      width:100%;
      border:1px solid var(--line);
      background:var(--panel-2);
      color:var(--text);
      border-radius:13px;
      padding:12px 13px;
      outline:none;
      font:inherit;
    }

    .modal input:focus,
    .modal select:focus{
      border-color:var(--accent);
    }

    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:5px;
    }

    .modal-note{
      margin:0;
      color:var(--muted);
      font-size:.72rem;
      line-height:1.45;
    }

    .modal-open{
      overflow:hidden;
    }

    @media(max-width:600px){
      header{
        display:grid;
        grid-template-columns:1fr;
      }

      .add-tool-btn{
        width:100%;
      }

      .category-head{
        align-items:flex-start;
        flex-direction:column;
      }

      .back-btn{
        width:100%;
      }

      .modal{
        padding:16px;
        border-radius:18px;
      }

      .modal-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
      }
    }

</style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">
        <small>Matriz</small>
        <h1>Ferramentas</h1>
        <p class="subtitle" id="pageSubtitle">Escolha uma categoria.</p>
      </div>

      <button class="add-tool-btn" id="openAddTool">+ Adicionar ferramenta</button>
    </header>

    <section id="homeView">
      <div class="section-title">Categorias</div>

      <div class="grid category-grid">
        <button class="card category-card" data-category="saude">
          <div class="card-top">
            <div class="app-icon">+</div>
            <span class="tag">Saúde</span>
          </div>
          <h2>Saúde</h2>
          <p>Exames e ferramentas relacionadas à saúde.</p>
          <div class="open"><span class="category-count" data-count="saude">0</span> ferramentas →</div>
        </button>

        <button class="card category-card" data-category="jogos">
          <div class="card-top">
            <div class="app-icon">◆</div>
            <span class="tag">Jogos</span>
          </div>
          <h2>Jogos</h2>
          <p>Pokémon GO e outras ferramentas de jogos.</p>
          <div class="open"><span class="category-count" data-count="jogos">0</span> ferramentas →</div>
        </button>

        <button class="card category-card" data-category="colecoes">
          <div class="card-top">
            <div class="app-icon">◉</div>
            <span class="tag">Coleções</span>
          </div>
          <h2>Coleções</h2>
          <p>Moedas e outras ferramentas para organizar coleções.</p>
          <div class="open"><span class="category-count" data-count="colecoes">0</span> ferramentas →</div>
        </button>
      </div>
    </section>

    <section id="categoryView" hidden>
      <div class="category-head">
        <button class="back-btn" id="backHome">← Categorias</button>
        <div>
          <div class="section-title" style="margin:0 0 5px">Categoria</div>
          <h2 id="categoryTitle" class="category-title">Jogos</h2>
        </div>
      </div>

      <div class="search category-search">
        <span class="icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Buscar nesta categoria..." autocomplete="off">
      </div>

      <div class="grid" id="toolsGrid"></div>

      <div class="empty" id="emptyState">
        Nenhuma ferramenta encontrada nesta categoria.
      </div>
    </section>

    <footer>
      <span>dehris.github.io/Ferramentas</span>
      <span>Matriz de ferramentas</span>
    </footer>
  </main>

  <div class="modal-backdrop" id="toolModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="section-title" style="margin:0 0 4px">Nova ferramenta</div>
          <h2>Adicionar à matriz</h2>
        </div>
        <button class="modal-close" id="closeAddTool" aria-label="Fechar">×</button>
      </div>

      <form id="toolForm">
        <label>
          Nome
          <input id="toolName" required placeholder="Ex.: Calculadora">
        </label>

        <label>
          Categoria
          <select id="toolCategory" required>
            <option value="saude">Saúde</option>
            <option value="jogos">Jogos</option>
            <option value="colecoes">Coleções</option>
          </select>
        </label>

        <label>
          Endereço
          <input id="toolUrl" required placeholder="calculadora/index.html">
        </label>

        <label>
          Descrição
          <input id="toolDescription" placeholder="Ex.: Calculadora rápida">
        </label>

        <div class="modal-actions">
          <button type="button" class="secondary-btn" id="cancelAddTool">Cancelar</button>
          <button type="submit" class="primary-btn">Adicionar</button>
        </div>

        <p class="modal-note">
          Ferramentas adicionadas por este botão ficam salvas neste navegador.
        </p>
      </form>
    </div>
  </div>

  <script>
    const defaultTools = [
      {
        name: "Exames",
        category: "saude",
        url: "exames/index.html",
        description: "Acesso à ferramenta de exames.",
        icon: "▣"
      },
      {
        name: "Pokémon GO",
        category: "jogos",
        url: "pokeGO/index.html",
        description: "Avaliador de pacotes, moedas e itens da loja.",
        icon: "◆"
      },
      {
        name: "PokéGO Dex",
        category: "jogos",
        url: "pokeGoDex/index.html",
        description: "Pokédex e coleção do Pokémon GO.",
        icon: "◇"
      },
      {
        name: "Coleção de Moedas",
        category: "colecoes",
        url: "moedas/index.html",
        description: "Controle de moedas, cédulas e itens da coleção.",
        icon: "◉"
      }
    ];

    const categoryNames = {
      saude: "Saúde",
      jogos: "Jogos",
      colecoes: "Coleções"
    };

    const categoryIcons = {
      saude: "+",
      jogos: "◆",
      colecoes: "◉"
    };

    const storageKey = "ferramentas_custom_v1";

    const homeView = document.getElementById("homeView");
    const categoryView = document.getElementById("categoryView");
    const toolsGrid = document.getElementById("toolsGrid");
    const categoryTitle = document.getElementById("categoryTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const emptyState = document.getElementById("emptyState");
    const searchInput = document.getElementById("searchInput");
    const toolModal = document.getElementById("toolModal");

    let currentCategory = null;

    function normalize(text){
      return (text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function getCustomTools(){
      try{
        return JSON.parse(localStorage.getItem(storageKey)) || [];
      }catch{
        return [];
      }
    }

    function getAllTools(){
      return [...defaultTools, ...getCustomTools()];
    }

    function normalizeUrl(url){
      return url.trim().replace(/^\.?\//, "");
    }

    function updateCounts(){
      const tools = getAllTools();
      Object.keys(categoryNames).forEach(category => {
        const count = tools.filter(tool => tool.category === category).length;
        const el = document.querySelector(`[data-count="${category}"]`);
        if(el) el.textContent = count;
      });
    }

    function renderTools(){
      const term = normalize(searchInput.value);
      const tools = getAllTools()
        .filter(tool => tool.category === currentCategory)
        .filter(tool => !term || normalize(`${tool.name} ${tool.description}`).includes(term));

      toolsGrid.innerHTML = "";

      tools.forEach(tool => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = `./${normalizeUrl(tool.url)}`;
        card.innerHTML = `
          <div class="card-top">
            <div class="app-icon">${tool.icon || categoryIcons[tool.category] || "•"}</div>
            <span class="tag">${categoryNames[tool.category]}</span>
          </div>
          <h2>${escapeHtml(tool.name)}</h2>
          <p>${escapeHtml(tool.description || "Abrir ferramenta.")}</p>
          <div class="open">Abrir ferramenta →</div>
        `;
        toolsGrid.appendChild(card);
      });

      emptyState.style.display = tools.length ? "none" : "block";
    }

    function openCategory(category){
      currentCategory = category;
      categoryTitle.textContent = categoryNames[category];
      pageSubtitle.textContent = `Categoria: ${categoryNames[category]}`;
      searchInput.value = "";
      homeView.hidden = true;
      categoryView.hidden = false;
      renderTools();
      window.scrollTo({top:0, behavior:"smooth"});
    }

    function goHome(){
      currentCategory = null;
      categoryView.hidden = true;
      homeView.hidden = false;
      pageSubtitle.textContent = "Escolha uma categoria.";
      updateCounts();
      window.scrollTo({top:0, behavior:"smooth"});
    }

    function openModal(){
      toolModal.hidden = false;
      document.body.classList.add("modal-open");
      setTimeout(() => document.getElementById("toolName").focus(), 20);
    }

    function closeModal(){
      toolModal.hidden = true;
      document.body.classList.remove("modal-open");
      document.getElementById("toolForm").reset();
    }

    function escapeHtml(value){
      return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    document.querySelectorAll(".category-card").forEach(card => {
      card.addEventListener("click", () => openCategory(card.dataset.category));
    });

    document.getElementById("backHome").addEventListener("click", goHome);
    searchInput.addEventListener("input", renderTools);

    document.getElementById("openAddTool").addEventListener("click", openModal);
    document.getElementById("closeAddTool").addEventListener("click", closeModal);
    document.getElementById("cancelAddTool").addEventListener("click", closeModal);

    toolModal.addEventListener("click", event => {
      if(event.target === toolModal) closeModal();
    });

    document.getElementById("toolForm").addEventListener("submit", event => {
      event.preventDefault();

      const name = document.getElementById("toolName").value.trim();
      const category = document.getElementById("toolCategory").value;
      const url = normalizeUrl(document.getElementById("toolUrl").value);
      const description = document.getElementById("toolDescription").value.trim();

      const tools = getCustomTools();
      tools.push({
        name,
        category,
        url,
        description,
        icon: categoryIcons[category]
      });

      localStorage.setItem(storageKey, JSON.stringify(tools));
      closeModal();
      updateCounts();
      openCategory(category);
    });

    updateCounts();
  </script>
</body>
</html>

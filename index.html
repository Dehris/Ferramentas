<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Ferramentas</title>
  <style>
    :root{
      --bg:#0b0d12;
      --panel:#12151d;
      --panel-2:#171b24;
      --text:#f4f6fb;
      --muted:#8f98aa;
      --line:#252b37;
      --accent:#7c5cff;
      --accent-2:#9b87ff;
      --shadow:0 14px 40px rgba(0,0,0,.22);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(124,92,255,.12), transparent 28rem),
        var(--bg);
      color:var(--text);
    }

    .wrap{
      width:min(1180px, calc(100% - 28px));
      margin:0 auto;
      padding:34px 0 60px;
    }

    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
      margin-bottom:26px;
    }

    .brand small{
      display:block;
      color:var(--accent-2);
      font-size:.76rem;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
      margin-bottom:7px;
    }

    h1{
      margin:0;
      font-size:clamp(2rem, 6vw, 4rem);
      line-height:.95;
      letter-spacing:-.055em;
    }

    .subtitle{
      margin:10px 0 0;
      color:var(--muted);
      font-size:.95rem;
    }

    .count{
      min-width:92px;
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(18,21,29,.78);
      color:var(--muted);
      text-align:center;
      font-size:.78rem;
    }

    .count strong{
      display:block;
      color:var(--text);
      font-size:1.25rem;
      margin-bottom:2px;
    }

    .toolbar{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      margin-bottom:18px;
      position:sticky;
      top:10px;
      z-index:20;
    }

    .search{
      position:relative;
    }

    .search input{
      width:100%;
      border:1px solid var(--line);
      background:rgba(18,21,29,.92);
      color:var(--text);
      border-radius:15px;
      padding:14px 16px 14px 43px;
      outline:none;
      font-size:.95rem;
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .search input:focus{
      border-color:var(--accent);
    }

    .search .icon{
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      color:var(--muted);
      pointer-events:none;
    }

    .filters{
      display:flex;
      gap:8px;
    }

    .filter{
      border:1px solid var(--line);
      background:rgba(18,21,29,.92);
      color:var(--muted);
      padding:0 14px;
      border-radius:15px;
      font-weight:700;
      cursor:pointer;
    }

    .filter.active{
      color:#fff;
      border-color:rgba(124,92,255,.65);
      background:rgba(124,92,255,.18);
    }

    .section-title{
      margin:28px 2px 12px;
      color:#c6ccda;
      font-size:.78rem;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:12px;
    }

    .card{
      display:flex;
      flex-direction:column;
      min-height:170px;
      padding:18px;
      border:1px solid var(--line);
      border-radius:20px;
      background:linear-gradient(180deg, rgba(23,27,36,.96), rgba(18,21,29,.96));
      color:inherit;
      text-decoration:none;
      transition:.18s ease;
      overflow:hidden;
      position:relative;
    }

    .card::after{
      content:"";
      position:absolute;
      width:120px;
      height:120px;
      border-radius:50%;
      background:rgba(124,92,255,.10);
      right:-50px;
      top:-55px;
      transition:.18s ease;
    }

    .card:hover{
      transform:translateY(-3px);
      border-color:#3a4353;
      box-shadow:var(--shadow);
    }

    .card:hover::after{
      transform:scale(1.25);
      background:rgba(124,92,255,.16);
    }

    .card-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:24px;
      position:relative;
      z-index:2;
    }

    .app-icon{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border-radius:13px;
      background:#202635;
      border:1px solid #2e3646;
      font-size:1.25rem;
    }

    .tag{
      font-size:.68rem;
      font-weight:800;
      color:#b7adff;
      background:rgba(124,92,255,.13);
      border:1px solid rgba(124,92,255,.22);
      padding:6px 8px;
      border-radius:999px;
    }

    .card h2{
      margin:0 0 6px;
      font-size:1.08rem;
      letter-spacing:-.02em;
      position:relative;
      z-index:2;
    }

    .card p{
      margin:0;
      color:var(--muted);
      font-size:.84rem;
      line-height:1.45;
      position:relative;
      z-index:2;
    }

    .open{
      margin-top:auto;
      padding-top:18px;
      color:#d8d3ff;
      font-size:.79rem;
      font-weight:800;
      position:relative;
      z-index:2;
    }

    .empty{
      grid-column:1/-1;
      border:1px dashed var(--line);
      border-radius:18px;
      padding:28px;
      text-align:center;
      color:var(--muted);
      display:none;
    }

    footer{
      margin-top:36px;
      padding-top:18px;
      border-top:1px solid var(--line);
      color:#687185;
      font-size:.75rem;
      display:flex;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    @media (max-width:780px){
      .wrap{
        width:min(100% - 20px, 700px);
        padding-top:22px;
      }

      header{
        align-items:flex-start;
      }

      .count{
        min-width:76px;
      }

      .toolbar{
        grid-template-columns:1fr;
        position:static;
      }

      .filters{
        overflow:auto;
        padding-bottom:2px;
      }

      .filter{
        min-height:40px;
        white-space:nowrap;
      }

      .grid{
        grid-template-columns:repeat(2, minmax(0,1fr));
      }

      .card{
        min-height:150px;
        padding:15px;
        border-radius:17px;
      }
    }

    @media (max-width:500px){
      h1{font-size:2.55rem}
      .subtitle{font-size:.85rem}
      .grid{grid-template-columns:1fr}
      .card{min-height:138px}
      .card-top{margin-bottom:16px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">
        <small>Matriz</small>
        <h1>Ferramentas</h1>
        <p class="subtitle">Atalhos para meus mini sites e utilitários.</p>
      </div>
      <div class="count">
        <strong id="toolCount">1</strong>
        ferramentas
      </div>
    </header>

    <div class="toolbar">
      <div class="search">
        <span class="icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Buscar ferramenta..." autocomplete="off">
      </div>

      <div class="filters" id="filters">
        <button class="filter active" data-filter="all">Todas</button>
        <button class="filter" data-filter="colecoes">Coleções</button>
        <button class="filter" data-filter="trabalho">Trabalho</button>
        <button class="filter" data-filter="utilitarios">Utilitários</button>
      </div>
    </div>

    <div class="section-title">Meus aplicativos</div>

    <section class="grid" id="toolsGrid">
      <!--
        PARA ADICIONAR UMA NOVA FERRAMENTA:
        copie um bloco <a class="card">...</a> e troque:
        href="./nome-da-pasta/"
        data-category="colecoes | trabalho | utilitarios"
        data-name="nome usado na busca"
      -->

      <a class="card"
         href="./moedas/"
         data-category="colecoes"
         data-name="coleção de moedas moedas cédulas países brasil">
        <div class="card-top">
          <div class="app-icon">◉</div>
          <span class="tag">Coleções</span>
        </div>
        <h2>Coleção de Moedas</h2>
        <p>Controle de moedas, cédulas e itens já adicionados à coleção.</p>
        <div class="open">Abrir ferramenta →</div>
      </a>

      <!-- EXEMPLO PARA O FUTURO:
      <a class="card"
         href="./pokemon/"
         data-category="utilitarios"
         data-name="pokemon go avaliador">
        <div class="card-top">
          <div class="app-icon">◆</div>
          <span class="tag">Utilitários</span>
        </div>
        <h2>Pokémon GO</h2>
        <p>Avaliador de pacotes, moedas e itens.</p>
        <div class="open">Abrir ferramenta →</div>
      </a>
      -->

      <div class="empty" id="emptyState">
        Nenhuma ferramenta encontrada.
      </div>
    </section>

    <footer>
      <span>dehris.github.io/Ferramentas</span>
      <span>Matriz de ferramentas</span>
    </footer>
  </main>

  <script>
    const searchInput = document.getElementById('searchInput');
    const filterButtons = [...document.querySelectorAll('.filter')];
    const cards = [...document.querySelectorAll('.card')];
    const emptyState = document.getElementById('emptyState');
    const toolCount = document.getElementById('toolCount');

    let activeFilter = 'all';

    function normalize(text){
      return text
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    function applyFilters(){
      const term = normalize(searchInput.value.trim());
      let visible = 0;

      cards.forEach(card => {
        const category = card.dataset.category;
        const name = normalize(card.dataset.name || '');
        const matchesCategory = activeFilter === 'all' || category === activeFilter;
        const matchesSearch = !term || name.includes(term);
        const show = matchesCategory && matchesSearch;

        card.style.display = show ? '' : 'none';
        if(show) visible++;
      });

      emptyState.style.display = visible ? 'none' : 'block';
      toolCount.textContent = cards.length;
    }

    searchInput.addEventListener('input', applyFilters);

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        button.classList.add('active');
        activeFilter = button.dataset.filter;
        applyFilters();
      });
    });

    applyFilters();
  </script>
</body>
</html>

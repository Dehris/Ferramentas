<body>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}.pg{flex:1 0 auto;box-sizing:border-box;font-family:'DM Sans',system-ui,sans-serif;color:#e0f7fa;background:linear-gradient(200deg,#0f2027,#2c5364);padding:44px 16px 28px;display:flex;justify-content:center;--btn:#4dd0e1;--bt:#0f2027;--r:16px}
.w{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;text-align:center}
.w.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:30px 18px 24px}
.lg{width:100px;height:100px;object-fit:cover;border-radius:0;margin-bottom:16px;display:grid;place-items:center;font-size:2.4rem;font-weight:700;background:rgba(255,255,255,.18)}
.lg.wide{width:auto;height:auto;max-width:220px;max-height:100px;object-fit:contain;background:none}.lg.bd{box-shadow:0 0 0 4px rgba(255,255,255,.85),0 10px 30px rgba(0,0,0,.2)}.lg.wide.bd{box-shadow:none}
h1{font-size:1.5rem;font-weight:700;line-height:1.2;margin:0}.sub{margin:6px 0 0;opacity:.85;font-weight:500}.bio{margin:10px 0 0;font-size:.92rem;line-height:1.55;opacity:.85;white-space:pre-line}
.so{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;justify-content:center}.so a{color:inherit;width:42px;height:42px;display:grid;place-items:center;border-radius:50%}.so.circle a{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
.ac{display:flex;gap:8px;margin-top:18px;flex-wrap:nowrap;justify-content:center}.chip{text-decoration:none;display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:.78rem;font-weight:600;padding:7px 12px;border-radius:999px;white-space:nowrap;flex:0 1 auto;color:inherit;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);cursor:pointer}
.ls{width:100%;display:flex;flex-direction:column;gap:11px;margin-top:24px}
.b{position:relative;display:flex;align-items:center;justify-content:center;min-height:46px;padding:9px 46px;border-radius:var(--r);text-decoration:none;font-weight:600;font-size:.93rem;line-height:1.25;transition:transform .15s,box-shadow .15s,background .15s}.b:hover{transform:translateY(-2px)}
.b.cp{font:inherit;font-weight:600;font-size:.93rem;cursor:pointer;width:100%;border:0}.b.cp .tx{display:flex;flex-direction:column;align-items:center;min-width:0}.b.cp small{font-size:.72rem;font-weight:500;opacity:.75;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.b .ci{position:absolute;right:15px;top:50%;transform:translateY(-50%);display:flex;opacity:.6}.toast{font-family:system-ui,-apple-system,sans-serif;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100vw - 32px);text-align:center;background:#111;color:#fff;padding:10px 18px;border-radius:16px;font-size:.85rem;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
.b .i{position:absolute;left:15px;top:50%;transform:translateY(-50%);display:flex}
.filled .b{background:var(--btn);color:var(--bt);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.outline .b{color:var(--btn);border:2px solid var(--btn)}.outline .b:hover{background:var(--btn);color:var(--bt)}
.soft .b{background:color-mix(in srgb,var(--btn) 22%,transparent);color:inherit}
.glass .b{background:color-mix(in srgb,var(--btn) 16%,transparent);color:inherit;border:1px solid color-mix(in srgb,var(--btn) 35%,transparent);backdrop-filter:blur(12px)}
.shadow .b{background:var(--btn);color:var(--bt);border:2px solid var(--bt);box-shadow:4px 4px 0 var(--bt)}
.b.hl{animation:p 2.4s ease-in-out infinite}.b.hl::after{content:"";position:absolute;inset:-4px;border-radius:calc(var(--r) + 4px);border:2px solid var(--btn);opacity:.45}
@keyframes p{50%{transform:scale(1.025)}}@media(prefers-reduced-motion:reduce){.b.hl{animation:none}}

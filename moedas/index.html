<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coleção de Moedas</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel2:#1f242d;
    --text:#f5f7fa;
    --muted:#9ca3af;
    --line:#2a3039;
    --accent:#d6b25e;
    --accent-dark:#17120a;
    --danger:#b86a6a;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  .wrap{
    max-width:900px;
    margin:auto;
    padding:18px 12px 40px;
  }

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }

  h1{
    margin:0;
    font-size:22px;
    line-height:1;
  }

  .count{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }

  .count strong{
    color:var(--accent);
    font-size:18px;
  }

  .toolbar{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(15,17,21,.96);
    padding:8px 0 10px;
  }

  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-bottom:8px;
  }

  .tab{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    border-radius:9px;
    padding:9px 8px;
    font-weight:700;
    cursor:pointer;
  }

  .tab.active{
    background:var(--accent);
    color:var(--accent-dark);
    border-color:var(--accent);
  }

  .search{
    width:100%;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    border-radius:9px;
    padding:10px 11px;
    outline:none;
    font-size:14px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
    margin-top:8px;
  }

  .card{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:10px;
    padding:10px;
    min-height:108px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:8px;
  }

  .country{
    font-size:14px;
    font-weight:800;
    line-height:1.15;
  }

  .currency{
    font-size:12px;
    color:var(--muted);
    line-height:1.25;
    margin-top:3px;
  }

  .action{
    width:100%;
    border:0;
    border-radius:8px;
    padding:8px 6px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    background:var(--accent);
    color:var(--accent-dark);
  }

  .owned .action{
    background:var(--panel2);
    color:#ddd;
    border:1px solid var(--line);
  }

  .empty{
    color:var(--muted);
    text-align:center;
    padding:34px 10px;
    font-size:13px;
  }

  .reset{
    width:100%;
    margin-top:14px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    border-radius:9px;
    padding:9px;
    cursor:pointer;
    font-size:12px;
  }

  @media(min-width:600px){
    .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  }

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  


  .type{
    display:inline-block;
    margin-top:5px;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    opacity:.8;
  }
  .manual-box{
    display:none;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:8px;
  }
  .manual-box.open{display:grid}
  .manual-box input{
    width:100%;
    min-width:0;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    border-radius:8px;
    padding:9px;
    font-size:12px;
    outline:none;
  }
  .manual-box button{
    grid-column:1/-1;
    border:0;
    border-radius:8px;
    background:var(--accent);
    color:var(--accent-dark);
    padding:9px;
    font-weight:800;
    cursor:pointer;
  }
  .manual-toggle{
    width:100%;
    margin-top:6px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    border-radius:8px;
    padding:8px;
    font-size:12px;
    cursor:pointer;
  }


  .main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
  .main-tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;padding:10px 6px;font-weight:800;cursor:pointer}
  .main-tab.active{background:#f5f7fa;color:#111;border-color:#f5f7fa}
  .brasil-section{display:none}
  .brasil-section.active{display:block}
  .world-section.hidden{display:none}
  .br-subtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
  .br-subtab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:9px;font-weight:800;cursor:pointer}
  .br-subtab.active{background:var(--accent);color:var(--accent-dark);border-color:var(--accent)}
  .br-filters{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:8px}
  .br-filter{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:700;cursor:pointer}
  .br-filter.active{color:var(--text);border-color:var(--accent)}
  .br-card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
  .br-title{font-size:13px;font-weight:800;line-height:1.15}
  .br-meta{font-size:10px;color:var(--muted);line-height:1.3;margin-top:3px}
  .br-action{width:100%;border:0;border-radius:7px;padding:7px 5px;font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-dark);cursor:pointer}
  .br-card.owned .br-action{background:var(--panel2);color:#ddd;border:1px solid var(--line)}
  .br-progress{font-size:11px;color:var(--muted);margin:6px 0 2px}


  #grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .card{aspect-ratio:1/1;min-height:0;border-radius:50%;padding:10px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;cursor:pointer;position:relative;overflow:hidden}
  .card .action{display:none!important}
  .flag{width:26px;height:18px;object-fit:cover;border-radius:2px;margin-bottom:3px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  .country{font-size:11px;line-height:1.05}.currency{font-size:9px;line-height:1.1;margin-top:2px}.type{font-size:7px;margin-top:2px}
  .card.owned{border-color:var(--accent);box-shadow:inset 0 0 0 2px rgba(214,178,94,.18)}
  .card.owned::after{content:"✓";position:absolute;top:7px;right:9px;font-size:10px;font-weight:900;color:var(--accent)}
  #brGrid{display:block;margin-top:8px}
  .br-year-row{display:grid;grid-template-columns:46px repeat(6,1fr);gap:5px;align-items:center;margin-bottom:6px}
  .br-year-label{font-size:11px;font-weight:800;color:var(--muted);text-align:center}
  .br-head{position:sticky;top:96px;z-index:5;background:var(--bg);padding:5px 0;margin-bottom:6px}
  .br-head .br-year-label{color:var(--muted)}
  .br-denom-label{font-size:9px;font-weight:800;color:var(--muted);text-align:center}
  .br-coin{aspect-ratio:1/1;width:100%;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:9px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .br-coin.owned{border-color:var(--accent);background:rgba(214,178,94,.12);color:var(--accent)}
  .br-coin.missing{opacity:.12;cursor:default}
  .br-card{aspect-ratio:1/1;border-radius:50%;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;cursor:pointer}
  .br-card .br-action{display:none!important}.br-title{font-size:10px}.br-meta{font-size:8px}.br-card.owned{border-color:var(--accent);box-shadow:inset 0 0 0 2px rgba(214,178,94,.18)}
  @media(max-width:420px){#grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.card{padding:8px 5px}.country{font-size:10px}.currency{font-size:8px}.flag{width:22px;height:15px}.br-year-row{grid-template-columns:38px repeat(6,1fr);gap:4px}.br-coin{font-size:8px}}

</style>

<style>
.card .period{
  width:96%;
  font-size:clamp(7px,1.85vw,10px);
  line-height:.9;
  font-weight:900;
  color:var(--accent);
  letter-spacing:-.025em;
  text-align:center;
  margin-top:2px;
  text-wrap:balance;
}
.card .type{
  opacity:.72;
}
@media(max-width:540px){
  .card .period{
    font-size:clamp(7px,1.7vw,9px);
  }
}
</style>


<style>
/* Brasil v12 — organização por período monetário */
#brasilSection #brFilters{display:none!important}
#brasilSection .br-subtabs{display:none!important}
#brasilSection #brSearch{margin:8px 0}
#brasilSection #brProgress{margin:5px 0 10px}

.br-era{
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.012);
  overflow:hidden;
  margin:0 0 12px;
}
.br-era-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  background:var(--panel2);
  border-bottom:1px solid var(--line);
}
.br-era-title{
  font-size:15px;
  line-height:1;
  font-weight:950;
  letter-spacing:-.025em;
}
.br-era-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
}
.br-era-period{
  flex:0 0 auto;
  color:var(--accent);
  font-size:11px;
  font-weight:950;
  white-space:nowrap;
}
.br-period-group{
  padding:10px 10px 12px;
  border-top:1px solid rgba(255,255,255,.04);
}
.br-period-group:first-of-type{border-top:0}
.br-period-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  font-size:11px;
  font-weight:950;
}
.br-period-title span{
  color:var(--accent);
  font-size:10px;
  white-space:nowrap;
}
.br-period-note{
  color:var(--muted);
  font-size:9px;
  line-height:1.3;
  margin:-2px 0 8px;
}
.br-kind-title{
  display:flex;
  align-items:center;
  gap:5px;
  margin:8px 0 6px;
  color:var(--muted);
  font-size:9px;
  font-weight:950;
  letter-spacing:.08em;
}
.br-kind-title span{
  color:var(--accent);
  letter-spacing:0;
}
.br-mini-title{
  color:var(--muted);
  font-size:8px;
  font-weight:900;
  margin:8px 0 5px;
}
.br-era-items{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px;
}
.br-era-items .br-chrono-card{
  width:100%;
}
.br-era-items .br-chrono-card .p{
  display:none!important;
}
.br-era-items .br-chrono-card .y{
  font-size:clamp(7px,1.7vw,9px)!important;
}
.br-note-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
}
.br-note-card{
  min-height:58px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
  padding:8px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.br-note-value{
  font-size:12px;
  font-weight:950;
  line-height:1.05;
}
.br-note-model{
  color:var(--muted);
  font-size:8px;
  line-height:1.15;
  margin-top:4px;
}
.br-real-head,.br-real-row{
  display:grid;
  grid-template-columns:35px repeat(6,minmax(0,1fr));
  gap:4px;
  align-items:center;
}
.br-real-head{
  margin:4px 0;
  color:var(--muted);
  font-size:7px;
  font-weight:900;
  text-align:center;
}
.br-real-row{margin-bottom:4px}
.br-real-year{
  color:var(--accent);
  font-size:8px;
  font-weight:950;
  text-align:center;
}
.br-real-row .br-real-coin{
  width:100%;
  border-radius:50%;
  padding:0;
  font-size:clamp(8px,2.1vw,11px)!important;
}
.br-no-results{
  padding:30px 10px;
  color:var(--muted);
  text-align:center;
  font-size:12px;
}
@media(max-width:420px){
  .br-era{margin-bottom:10px}
  .br-era-header{padding:10px}
  .br-era-title{font-size:14px}
  .br-era-period{font-size:10px}
  .br-period-group{padding:8px}
  .br-era-items{gap:5px}
  .br-note-grid{gap:5px}
  .br-note-card{padding:7px;min-height:54px}
  .br-note-value{font-size:11px}
}
</style>


<style>
/* Brasil v13 — proporções mais equilibradas */
.br-era-items{
  grid-template-columns:repeat(6,minmax(0,1fr)) !important;
  gap:5px !important;
}
.br-era-items .br-chrono-card{
  transform:scale(.88);
  transform-origin:center;
  margin:-3px 0;
}
.br-note-grid{
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  gap:8px !important;
}
.br-note-card{
  min-height:86px !important;
  padding:0 !important;
  overflow:hidden;
  position:relative;
}
.br-note-thumb{
  width:100%;
  aspect-ratio:1.75/1;
  object-fit:cover;
  display:block;
  background:#111;
  border-bottom:1px solid var(--line);
}
.br-note-info{
  padding:8px 9px 9px;
}
.br-note-value{
  font-size:13px !important;
}
.br-note-model{
  font-size:9px !important;
}
.br-note-placeholder{
  width:100%;
  aspect-ratio:1.75/1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(135deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  border-bottom:1px solid var(--line);
}
.br-real-head,.br-real-row{
  grid-template-columns:34px repeat(6,minmax(0,1fr)) !important;
}
.br-real-row .br-real-coin{
  transform:scale(.9);
}
@media(max-width:420px){
  .br-era-items{grid-template-columns:repeat(5,minmax(0,1fr)) !important}
  .br-note-card{min-height:82px !important}
}
</style>


<style>
.br-note-thumb{
  aspect-ratio:2.05/1 !important;
  object-fit:contain !important;
  background:#f3f3f3 !important;
  padding:5px !important;
}
.br-note-placeholder.br-note-fallback{
  aspect-ratio:2.05/1 !important;
}
.br-note-card{
  min-height:104px !important;
}
.br-note-info{
  padding-top:6px !important;
}
</style>


<style>
/* v15 — cédulas incorporadas no próprio HTML */
.br-note-card{
  min-height:128px !important;
  padding:0 !important;
  overflow:hidden;
}
.embedded-note{
  width:100%;
  aspect-ratio:2.12/1;
  position:relative;
  overflow:hidden;
  background:var(--note-bg,#c8c8c0);
  border-bottom:1px solid var(--line);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.embedded-note::before{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid rgba(30,30,30,.20);
  border-radius:3px;
}
.embedded-note-band{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:18%;
  background:var(--note-accent);
  opacity:.72;
}
.embedded-note-band::after{
  content:"";
  position:absolute;
  inset:9px 5px;
  border:1px dashed rgba(255,255,255,.55);
}
.embedded-note-num{
  position:absolute;
  left:22%;
  top:9%;
  font-size:clamp(20px,6vw,32px);
  font-weight:950;
  line-height:1;
  color:rgba(25,25,25,.72);
  letter-spacing:-.07em;
}
.embedded-note-face{
  position:absolute;
  right:10%;
  top:13%;
  width:27%;
  aspect-ratio:.78/1;
  border-radius:48% 48% 44% 44%;
  background:
    radial-gradient(circle at 53% 34%,rgba(255,255,255,.42) 0 7%,transparent 8%),
    radial-gradient(circle at 34% 34%,rgba(255,255,255,.42) 0 7%,transparent 8%),
    linear-gradient(145deg,rgba(255,255,255,.28),rgba(0,0,0,.08));
  border:2px solid rgba(40,40,40,.17);
}
.embedded-note-family{
  position:absolute;
  left:22%;
  bottom:9%;
  max-width:48%;
  font-size:8px;
  line-height:1;
  font-weight:950;
  color:rgba(30,30,30,.65);
  text-transform:uppercase;
}
.embedded-note-animal{
  position:absolute;
  right:6%;
  bottom:7%;
  max-width:34%;
  text-align:right;
  font-size:7px;
  font-weight:950;
  color:rgba(30,30,30,.64);
  text-transform:uppercase;
}
.historical-note{
  background:
    linear-gradient(135deg,rgba(204,190,153,.88),rgba(165,181,158,.88));
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:8px 12px;
  box-sizing:border-box;
}
.historical-note-pattern{
  max-width:92%;
  text-align:center;
  font-size:9px;
  line-height:1.05;
  font-weight:900;
  color:rgba(30,30,30,.68);
}
.historical-note-value{
  margin-top:4px;
  text-align:center;
  font-size:15px;
  font-weight:950;
  color:rgba(25,25,25,.78);
}
.historical-note-mark{
  position:absolute;
  right:8px;
  bottom:5px;
  font-size:6px;
  font-weight:900;
  letter-spacing:.15em;
  color:rgba(30,30,30,.38);
}
.br-note-info{
  padding:7px 9px 9px !important;
}

/* comemorativas — nome visível, não apenas o ano */
.br-comm-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
}
.br-comm-card{
  min-height:74px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
  padding:8px;
  cursor:pointer;
  display:grid;
  grid-template-columns:auto 1fr;
  grid-template-rows:auto 1fr auto;
  column-gap:7px;
  align-items:start;
}
.comm-year{
  grid-row:1 / span 3;
  min-width:34px;
  color:var(--accent);
  font-size:12px;
  font-weight:950;
  line-height:1;
  padding-top:2px;
}
.comm-name{
  font-size:10px;
  line-height:1.08;
  font-weight:900;
  text-wrap:balance;
}
.comm-value{
  margin-top:4px;
  color:var(--muted);
  font-size:8px;
  font-weight:800;
}
@media(max-width:420px){
  .br-comm-grid{grid-template-columns:1fr 1fr}
  .br-comm-card{padding:7px;min-height:72px}
  .comm-year{min-width:31px;font-size:11px}
  .comm-name{font-size:9px}
}
</style>

</head>
<body>
<div class="wrap">
  <div class="main-tabs">
    <button class="main-tab active" data-main="world">Mundo</button>
    <button class="main-tab" data-main="brasil">Brasil</button>
  </div>
  <div id="worldSection" class="world-section">
  <header>
    <div>
      <h1>Moedas</h1>
    </div>
    <div class="count"><strong id="count">0</strong> / <span id="total">0</span></div>
  </header>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-tab="missing">Faltam</button>
      <button class="tab" data-tab="owned">Já tenho</button>
    </div>

    <input id="search" class="search" type="search" placeholder="Buscar país, território, histórico ou moeda">

    <button id="manualToggle" class="manual-toggle">+ Adicionar emissor manualmente</button>
    <div id="manualBox" class="manual-box">
      <input id="manualCountry" placeholder="País / emissor antigo">
      <input id="manualCurrency" placeholder="Moeda">
      <button id="manualAdd">Adicionar como “Já tenho”</button>
    </div>

function coinPeriod(country, currency, type){
  if (coinPeriods[country]) return coinPeriods[country];

  // Fallback visual: every entry shows a period.
  return type === "Histórico" ? "período histórico" : "vigente hoje";
}

function render(){
  const term = search.value.trim().toLocaleLowerCase("pt-BR");

  document.querySelectorAll(".tab").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.tab === currentTab);
  });

  const filtered = coins.filter(([country,currency,type])=>{
    const isOwned = owned.has(country);
    const tabMatch = currentTab === "owned" ? isOwned : !isOwned;
    const period = coinPeriod(country,currency,type);
    const searchMatch = !term || `${country} ${currency} ${type || ""} ${period}`.toLocaleLowerCase("pt-BR").includes(term);
    return tabMatch && searchMatch;
  });

  grid.innerHTML = "";

  filtered.forEach(([country,currency,type])=>{
    const isOwned = owned.has(country);

    const card = document.createElement("div");
    card.className = "card" + (isOwned ? " owned" : "");
    const flag = flagUrl(country);
    card.innerHTML = `
      ${flag ? `<img class="flag" src="${flag}" alt="" onerror="this.outerHTML=\'<div class=&quot;flag-fallback&quot;>—</div>\'">` : `<div class="flag-fallback">—</div>`}
      <div class="country">${country}</div>
      <div class="currency">${currency}</div>
      ${coinPeriod(country,currency,type) ? `<div class="period">${coinPeriod(country,currency,type)}</div>` : ""}
      <div class="type">${type || "Personalizado"}</div>
    `;
    card.addEventListener("click", ()=>{
      if(isOwned) owned.delete(country); else owned.add(country);
      save(); render();
    });

    grid.appendChild(card);
  });

  empty.hidden = filtered.length > 0;
  count.textContent = owned.size;
  total.textContent = coins.length;
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentTab = btn.dataset.tab;
    render();
  });
});

search.addEventListener("input", render);

document.getElementById("reset").addEventListener("click", ()=>{
  if(confirm("Limpar toda a coleção?")){
    owned.clear();
    save();
    render();
  }
});

  for(const c of customCoins){

      coins.push(c);

  }
  coins.sort((a,b)=>a[0].localeCompare(b[0],"pt-BR"));
}

const manualToggle = document.getElementById("manualToggle");

  manualBox.classList.toggle("open");
});

manualAdd.addEventListener("click", ()=>{
  const country = manualCountry.value.trim();
  const currency = manualCurrency.value.trim() || "Moeda não informada";
  if(!country) return;

  if(!coins.some(x => x[0].toLocaleLowerCase("pt-BR") === country.toLocaleLowerCase("pt-BR"))){
    const item = [country,currency,"Personalizado"];
    coins.push(item);
    customCoins.push(item);
    saveCustom();
    coins.sort((a,b)=>a[0].localeCompare(b[0],"pt-BR"));
  }

  owned.add(country);
  save();
  manualCountry.value = "";
  manualCurrency.value = "";
  manualBox.classList.remove("open");
  currentTab = "owned";
  render();
});

function banknoteVisualData(item){
  return realBanknoteVisuals[`${item.pattern}|${item.value}`] || null;
}

function banknoteThumbHTML(item){
  const v = banknoteVisualData(item);
  const value = item.value.replace(" reais","").replace(" real","");
  const patternShort = item.pattern
    .replace("Real — ","")
    .replace("Cruzeiro ","Cr$ ")
    .replace("Cruzeiro Novo","NCr$")
    .replace("Cruzeiro Real","CR$")
    .replace("Cruzado Novo","NCz$")
    .replace("Cruzado","Cz$");

  if(v){
    return `
      <div class="embedded-note" style="--note-bg:${v.bg};--note-accent:${v.accent}">
        <div class="embedded-note-band"></div>
        <div class="embedded-note-num">${value}</div>
        <div class="embedded-note-face"></div>
        <div class="embedded-note-family">${patternShort}</div>
        <div class="embedded-note-animal">${v.animal}</div>
      </div>`;
  }

  // Historical notes: self-contained identification card.
  // It is not a photographic reproduction, but remains visible offline.
  return `
    <div class="embedded-note historical-note">
      <div class="historical-note-pattern">${item.pattern}</div>
      <div class="historical-note-value">${item.value}</div>
      <div class="historical-note-mark">CÉDULA</div>
    </div>`;
}

    };
    return num(a.value)-num(b.value) || a.value.localeCompare(b.value,"pt-BR");

  function coinCards(items){
    if(!items.length) return "";
    const commemorative = items.some(x=>x.pattern==="Real — comemorativas");

        }else{
          inner += coinCards(groupCoins);
        }
      }

      if(groupNotes.length){
        if(era.key==="real"){
          const fam1 = groupNotes.filter(x=>x.pattern==="Real — 1ª família");
          const fam2 = groupNotes.filter(x=>x.pattern==="Real — 2ª família");

          inner += `<div class="br-kind-title">CÉDULAS <span>${groupNotes.length}</span></div>`;
          if(fam1.length) inner += `<div class="br-mini-title">1ª FAMÍLIA</div>${noteCards(fam1)}`;
          if(fam2.length) inner += `<div class="br-mini-title">2ª FAMÍLIA</div>${noteCards(fam2)}`;
        }else{
          inner += `<div class="br-kind-title">CÉDULAS <span>${groupNotes.length}</span></div>${noteCards(groupNotes)}`;
        }
      }

      inner += `</div>`;
    }

    if(eraHasContent){
      out += `<section class="br-era">
        <div class="br-era-header">
          <div>
            <div class="br-era-title">${era.title}</div>
            ${era.subtitle ? `<div class="br-era-sub">${era.subtitle}</div>` : ""}
          </div>
          <div class="br-era-period">${era.period}</div>
        </div>
        ${inner}
      </section>`;
    }
  }

  brGrid.innerHTML = out || `<div class="br-no-results">Nenhum item encontrado.</div>`;

  brGrid.querySelectorAll(".br-collection-item").forEach(el=>{
    el.addEventListener("click",()=>{
      const id = decodeURIComponent(el.dataset.id);
      if(brOwned.has(id)) brOwned.delete(id);
      else brOwned.add(id);
      saveBrazil();
      renderBrazil();
    });
  });

  brCount.textContent = brOwned.size;
  brTotal.textContent = brazilCoins.length + brazilNotes.length;
  brProgress.textContent = `${brState==="owned" ? "Já tenho" : "Faltam"}: ${coins.length + notes.length} itens`;
}

render();



</script>

<script>
/* Quebras pensadas para aproveitar a largura dos círculos */
(function(){
  const originalRenderBrazil = renderBrazil;
  renderBrazil = function(){
    originalRenderBrazil();

    document.querySelectorAll(".br-chrono-card .v").forEach(el=>{
      let t=el.textContent.trim();
      const replacements = {
        "1.000 réis":"1.000<br>réis",
        "2.000 réis":"2.000<br>réis",
        "5.000 réis":"5.000<br>réis",
        "10.000 réis":"10.000<br>réis",
        "20.000 réis":"20.000<br>réis",
        "50.000 réis":"50.000<br>réis",
        "100.000 réis":"100.000<br>réis",
        "200.000 réis":"200.000<br>réis",
        "500.000 réis":"500.000<br>réis",
        "1 conto de réis":"1 conto<br>de réis"
      };
      if(replacements[t]) el.innerHTML=replacements[t];
      else {
        el.innerHTML=t
          .replace(/ (cruzeiros reais)$/i,"<br>$1")
          .replace(/ (cruzeiros novos)$/i,"<br>$1")
          .replace(/ (cruzeiros)$/i,"<br>$1")
          .replace(/ (cruzados novos)$/i,"<br>$1")
          .replace(/ (cruzados)$/i,"<br>$1")
          .replace(/ (centavos)$/i,"<br>$1");
      }
    });

    document.querySelectorAll(".br-chrono-card .p").forEach(el=>{
      let t=el.innerHTML;
      t=t
        .replace("Réis — Império","Réis<br>Império")
        .replace("Réis — República","Réis<br>República")
        .replace("Cruzeiro Novo","Cruzeiro<br>Novo")
        .replace("Cruzado Novo","Cruzado<br>Novo")
        .replace("Cruzeiro Real","Cruzeiro<br>Real")
        .replace("Real — comemorativas","Real<br>comemorativa");
      el.innerHTML=t;
    });
  };

  /* Re-render if Brazil is already visible */
  if(document.getElementById("brasilSection")?.classList.contains("active")){
    renderBrazil();
  }
})();
</script>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coleção de Moedas</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel2:#1f242d;
    --text:#f5f7fa;
    --muted:#9ca3af;
    --line:#2a3039;
    --accent:#d6b25e;
    --accent-dark:#17120a;
    --danger:#b86a6a;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  .wrap{
    max-width:900px;
    margin:auto;
    padding:18px 12px 40px;
  }

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }

  h1{
    margin:0;
    font-size:22px;
    line-height:1;
  }

  .count{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }

  .count strong{
    color:var(--accent);
    font-size:18px;
  }

  .toolbar{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(15,17,21,.96);
    padding:8px 0 10px;
  }

  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-bottom:8px;
  }

  .tab{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    border-radius:9px;
    padding:9px 8px;
    font-weight:700;
    cursor:pointer;
  }

  .tab.active{
    background:var(--accent);
    color:var(--accent-dark);
    border-color:var(--accent);
  }

  .search{
    width:100%;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    border-radius:9px;
    padding:10px 11px;
    outline:none;
    font-size:14px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
    margin-top:8px;
  }

  .card{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:10px;
    padding:10px;
    min-height:108px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:8px;
  }

  .country{
    font-size:14px;
    font-weight:800;
    line-height:1.15;
  }

  .currency{
    font-size:12px;
    color:var(--muted);
    line-height:1.25;
    margin-top:3px;
  }

  .action{
    width:100%;
    border:0;
    border-radius:8px;
    padding:8px 6px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    background:var(--accent);
    color:var(--accent-dark);
  }

  .owned .action{
    background:var(--panel2);
    color:#ddd;
    border:1px solid var(--line);
  }

  .empty{
    color:var(--muted);
    text-align:center;
    padding:34px 10px;
    font-size:13px;
  }

  .reset{
    width:100%;
    margin-top:14px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    border-radius:9px;
    padding:9px;
    cursor:pointer;
    font-size:12px;
  }

  @media(min-width:600px){
    .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  }

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  


  .type{
    display:inline-block;
    margin-top:5px;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    opacity:.8;
  }
  .manual-box{
    display:none;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:8px;
  }
  .manual-box.open{display:grid}
  .manual-box input{
    width:100%;
    min-width:0;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    border-radius:8px;
    padding:9px;
    font-size:12px;
    outline:none;
  }
  .manual-box button{
    grid-column:1/-1;
    border:0;
    border-radius:8px;
    background:var(--accent);
    color:var(--accent-dark);
    padding:9px;
    font-weight:800;
    cursor:pointer;
  }
  .manual-toggle{
    width:100%;
    margin-top:6px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    border-radius:8px;
    padding:8px;
    font-size:12px;
    cursor:pointer;
  }


  .main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
  .main-tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;padding:10px 6px;font-weight:800;cursor:pointer}
  .main-tab.active{background:#f5f7fa;color:#111;border-color:#f5f7fa}
  .brasil-section{display:none}
  .brasil-section.active{display:block}
  .world-section.hidden{display:none}
  .br-subtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
  .br-subtab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:9px;font-weight:800;cursor:pointer}
  .br-subtab.active{background:var(--accent);color:var(--accent-dark);border-color:var(--accent)}
  .br-filters{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:8px}
  .br-filter{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:700;cursor:pointer}
  .br-filter.active{color:var(--text);border-color:var(--accent)}
  .br-card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
  .br-title{font-size:13px;font-weight:800;line-height:1.15}
  .br-meta{font-size:10px;color:var(--muted);line-height:1.3;margin-top:3px}
  .br-action{width:100%;border:0;border-radius:7px;padding:7px 5px;font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-dark);cursor:pointer}
  .br-card.owned .br-action{background:var(--panel2);color:#ddd;border:1px solid var(--line)}
  .br-progress{font-size:11px;color:var(--muted);margin:6px 0 2px}


  #grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .card{aspect-ratio:1/1;min-height:0;border-radius:50%;padding:10px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;cursor:pointer;position:relative;overflow:hidden}
  .card .action{display:none!important}
  .flag{width:26px;height:18px;object-fit:cover;border-radius:2px;margin-bottom:3px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  .country{font-size:11px;line-height:1.05}.currency{font-size:9px;line-height:1.1;margin-top:2px}.type{font-size:7px;margin-top:2px}
  .card.owned{border-color:var(--accent);box-shadow:inset 0 0 0 2px rgba(214,178,94,.18)}
  .card.owned::after{content:"✓";position:absolute;top:7px;right:9px;font-size:10px;font-weight:900;color:var(--accent)}
  #brGrid{display:block;margin-top:8px}
  .br-year-row{display:grid;grid-template-columns:46px repeat(6,1fr);gap:5px;align-items:center;margin-bottom:6px}
  .br-year-label{font-size:11px;font-weight:800;color:var(--muted);text-align:center}
  .br-head{position:sticky;top:96px;z-index:5;background:var(--bg);padding:5px 0;margin-bottom:6px}
  .br-head .br-year-label{color:var(--muted)}
  .br-denom-label{font-size:9px;font-weight:800;color:var(--muted);text-align:center}
  .br-coin{aspect-ratio:1/1;width:100%;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:9px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .br-coin.owned{border-color:var(--accent);background:rgba(214,178,94,.12);color:var(--accent)}
  .br-coin.missing{opacity:.12;cursor:default}
  .br-card{aspect-ratio:1/1;border-radius:50%;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;cursor:pointer}
  .br-card .br-action{display:none!important}.br-title{font-size:10px}.br-meta{font-size:8px}.br-card.owned{border-color:var(--accent);box-shadow:inset 0 0 0 2px rgba(214,178,94,.18)}
  @media(max-width:420px){#grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.card{padding:8px 5px}.country{font-size:10px}.currency{font-size:8px}.flag{width:22px;height:15px}.br-year-row{grid-template-columns:38px repeat(6,1fr);gap:4px}.br-coin{font-size:8px}}

</style>
</head>
<body>
<div class="wrap">
  <div class="main-tabs">
    <button class="main-tab active" data-main="world">Mundo</button>
    <button class="main-tab" data-main="brasil">Brasil</button>
  </div>
  <div id="worldSection" class="world-section">
  <header>
    <div>
      <h1>Moedas</h1>
    </div>
    <div class="count"><strong id="count">0</strong> / <span id="total">0</span></div>
  </header>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-tab="missing">Faltam</button>
      <button class="tab" data-tab="owned">Já tenho</button>
    </div>

    <input id="search" class="search" type="search" placeholder="Buscar país, território, histórico ou moeda">

    <button id="manualToggle" class="manual-toggle">+ Adicionar emissor manualmente</button>
    <div id="manualBox" class="manual-box">
      <input id="manualCountry" placeholder="País / emissor antigo">
      <input id="manualCurrency" placeholder="Moeda">
      <button id="manualAdd">Adicionar como “Já tenho”</button>
    </div>
</div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>Nenhum item encontrado.</div>

  <button id="reset" class="reset">Limpar coleção</button>
  </div>

  <div id="brasilSection" class="brasil-section">
    <header>
      <div><h1>Brasil</h1></div>
      <div class="count"><strong id="brCount">0</strong> / <span id="brTotal">0</span></div>
    </header>

    <div class="br-subtabs">
      <button class="br-subtab active" data-brtab="coins">Moedas</button>
      <button class="br-subtab" data-brtab="notes">Cédulas</button>
    </div>

    <div class="br-state-tabs">
      <button class="br-state-tab active" data-brstate="missing">Faltam</button>
      <button class="br-state-tab" data-brstate="owned">Já tenho</button>
    </div>

    <div id="brFilters" class="br-filters"></div>
    <input id="brSearch" class="search" type="search" placeholder="Buscar valor, ano, padrão ou modelo">
    <div id="brProgress" class="br-progress"></div>
    <div id="brGrid" class="grid"></div>
  </div>

</div>

const KEY = "colecao-moedas-paises-v1";
let owned = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let currentTab = "missing";

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const search = document.getElementById("search");
const count = document.getElementById("count");
const total = document.getElementById("total");

function save(){
  localStorage.setItem(KEY, JSON.stringify([...owned]));
}

function render(){
  const term = search.value.trim().toLocaleLowerCase("pt-BR");

  document.querySelectorAll(".tab").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.tab === currentTab);
  });

  const filtered = coins.filter(([country,currency,type])=>{
    const isOwned = owned.has(country);
    const tabMatch = currentTab === "owned" ? isOwned : !isOwned;
    const searchMatch = !term || `${country} ${currency} ${type || ""}`.toLocaleLowerCase("pt-BR").includes(term);
    return tabMatch && searchMatch;
  });

  grid.innerHTML = "";

  filtered.forEach(([country,currency,type])=>{
    const isOwned = owned.has(country);

    const card = document.createElement("div");
    card.className = "card" + (isOwned ? " owned" : "");
    const flag = flagUrl(country);
    card.innerHTML = `
      ${flag ? `<img class="flag" src="${flag}" alt="" onerror="this.outerHTML=\'<div class=&quot;flag-fallback&quot;>—</div>\'">` : `<div class="flag-fallback">—</div>`}
      <div class="country">${country}</div>
      <div class="currency">${currency}</div>
      <div class="type">${type || "Personalizado"}</div>
    `;
    card.addEventListener("click", ()=>{
      if(isOwned) owned.delete(country); else owned.add(country);
      save(); render();
    });

    grid.appendChild(card);
  });

  empty.hidden = filtered.length > 0;
  count.textContent = owned.size;
  total.textContent = coins.length;
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentTab = btn.dataset.tab;
    render();
  });
});

search.addEventListener("input", render);

document.getElementById("reset").addEventListener("click", ()=>{
  if(confirm("Limpar toda a coleção?")){
    owned.clear();
    save();
    render();
  }
});


const CUSTOM_KEY = "colecao-moedas-custom-v1";
let customCoins = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]");

function saveCustom(){
  localStorage.setItem(CUSTOM_KEY, JSON.stringify(customCoins));
}

function ensureCustomInList(){
  for(const c of customCoins){
    if(!coins.some(x => x[0] === c[0])){
      coins.push(c);
    }
  }
  coins.sort((a,b)=>a[0].localeCompare(b[0],"pt-BR"));
}

ensureCustomInList();

const manualToggle = document.getElementById("manualToggle");
const manualBox = document.getElementById("manualBox");
const manualCountry = document.getElementById("manualCountry");
const manualCurrency = document.getElementById("manualCurrency");
const manualAdd = document.getElementById("manualAdd");

manualToggle.addEventListener("click", ()=>{
  manualBox.classList.toggle("open");
});

manualAdd.addEventListener("click", ()=>{
  const country = manualCountry.value.trim();
  const currency = manualCurrency.value.trim() || "Moeda não informada";
  if(!country) return;

  if(!coins.some(x => x[0].toLocaleLowerCase("pt-BR") === country.toLocaleLowerCase("pt-BR"))){
    const item = [country,currency,"Personalizado"];
    coins.push(item);
    customCoins.push(item);
    saveCustom();
    coins.sort((a,b)=>a[0].localeCompare(b[0],"pt-BR"));
  }

  owned.add(country);
  save();
  manualCountry.value = "";
  manualCurrency.value = "";
  manualBox.classList.remove("open");
  currentTab = "owned";
  render();
});



const BR_KEY = "colecao-brasil-v1";
let brOwned = new Set(JSON.parse(localStorage.getItem(BR_KEY) || "[]"));
let brTab = "coins";
let brState = "missing";
let brFilter = "Todos";

const worldSection = document.getElementById("worldSection");
const brasilSection = document.getElementById("brasilSection");
const brGrid = document.getElementById("brGrid");
const brSearch = document.getElementById("brSearch");
const brFilters = document.getElementById("brFilters");
const brCount = document.getElementById("brCount");
const brTotal = document.getElementById("brTotal");
const brProgress = document.getElementById("brProgress");

function saveBrazil(){ localStorage.setItem(BR_KEY, JSON.stringify([...brOwned])); }

document.querySelectorAll(".main-tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const isBR = btn.dataset.main === "brasil";
    document.querySelectorAll(".main-tab").forEach(x=>x.classList.toggle("active",x===btn));
    worldSection.classList.toggle("hidden",isBR);
    brasilSection.classList.toggle("active",isBR);
    if(isBR) renderBrazil();
  });
});

document.querySelectorAll(".br-subtab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    brTab=btn.dataset.brtab;
    brFilter="Todos";
    document.querySelectorAll(".br-subtab").forEach(x=>x.classList.toggle("active",x===btn));
    renderBrazil();
  });
});


document.querySelectorAll(".br-state-tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    brState = btn.dataset.brstate;
    document.querySelectorAll(".br-state-tab").forEach(x=>x.classList.toggle("active",x===btn));
    renderBrazil();
  });
});

brSearch.addEventListener("input",renderBrazil);


function renderBrazil(){
  const data = brTab === "coins" ? brazilCoins : brazilNotes;
  const term = brSearch.value.trim().toLocaleLowerCase("pt-BR");

  // Faltam mostra não marcadas; Já tenho mostra marcadas.
  let missing = data.filter(x => brState === "owned" ? brOwned.has(x.id) : !brOwned.has(x.id));
  if(term){
    missing = missing.filter(x =>
      `${x.pattern} ${x.value} ${x.year} ${x.note}`.toLocaleLowerCase("pt-BR").includes(term)
    );
  }

  brFilters.innerHTML = "";

  if(brTab === "coins"){
    // Real gets year-by-year grid; everything else appears chronologically by era/pattern.
    const real = missing.filter(x=>x.pattern==="Real");
    const other = missing.filter(x=>x.pattern!=="Real");

    // Chronological era order
    const eraOrder = [
      "Réis — Império","Réis — República","Cruzeiro 1942","Cruzeiro Novo",
      "Cruzeiro 1970","Cruzado","Cruzado Novo","Cruzeiro 1990","Cruzeiro Real",
      "Real — comemorativas"
    ];
    const eraRank = Object.fromEntries(eraOrder.map((x,i)=>[x,i]));

    other.sort((a,b)=>{
      const ra = eraRank[a.pattern] ?? 999;
      const rb = eraRank[b.pattern] ?? 999;
      if(ra !== rb) return ra-rb;
      const ya = parseInt((a.year||"").match(/\d{4}/)?.[0] || "0");
      const yb = parseInt((b.year||"").match(/\d{4}/)?.[0] || "0");
      if(ya !== yb) return ya-yb;
      return a.value.localeCompare(b.value,"pt-BR");
    });

    let htmlOut = "";

    if(other.length){
      htmlOut += `<div class="br-chrono">`;
      for(const x of other){
        htmlOut += `
          <div class="br-chrono-card" data-id="${encodeURIComponent(x.id)}" title="${x.pattern} · ${x.value}">
            <div class="v">${x.value}</div>
            <div class="y">${x.year || ""}</div>
            <div class="p">${x.pattern}</div>
          </div>`;
      }
      htmlOut += `</div>`;
    }

    if(real.length){
      const denoms = ["1 centavo","5 centavos","10 centavos","25 centavos","50 centavos","1 real"];
      const short = ["1c","5c","10c","25c","50c","1R"];
      const years = [...new Set(real.map(x=>x.year))].sort((a,b)=>Number(a)-Number(b));

      htmlOut += `<div style="margin-top:14px">`;
      for(const y of years){
        htmlOut += `<div class="br-year-block">
          <div class="br-year-title">${y}</div>
          <div class="br-year-coins">`;
        for(let i=0;i<denoms.length;i++){
          const item = real.find(x=>x.year===y && x.value===denoms[i]);
          if(item){
            htmlOut += `<button class="br-real-coin" data-id="${encodeURIComponent(item.id)}">${short[i]}</button>`;
          } else {
            htmlOut += `<div class="br-real-coin br-empty">${short[i]}</div>`;
          }
        }
        htmlOut += `</div></div>`;
      }
      htmlOut += `</div>`;
    }

    brGrid.style.display = "block";
    brGrid.innerHTML = htmlOut;

    brGrid.querySelectorAll("[data-id]").forEach(el=>{
      el.addEventListener("click",()=>{
        const id = decodeURIComponent(el.dataset.id);
        if(brOwned.has(id)) brOwned.delete(id);
        else brOwned.add(id);
        saveBrazil();
        renderBrazil();
      });
    });

  } else {
    // Notes: chronological by monetary standard, circles, hide after click.
    const noteOrder = [
      "Réis","Cruzeiro 1942","Cruzeiro Novo","Cruzeiro 1970","Cruzado",
      "Cruzado Novo","Cruzeiro 1990","Cruzeiro Real","Real — 1ª família","Real — 2ª família"
    ];
    const rank = Object.fromEntries(noteOrder.map((x,i)=>[x,i]));
    missing.sort((a,b)=>{
      const ra=rank[a.pattern]??999, rb=rank[b.pattern]??999;
      if(ra!==rb) return ra-rb;
      return a.value.localeCompare(b.value,"pt-BR");
    });

    brGrid.style.display = "grid";
    brGrid.style.gridTemplateColumns = "repeat(5,minmax(0,1fr))";
    brGrid.style.gap = "6px";
    brGrid.innerHTML = "";

    missing.forEach(x=>{
      const card=document.createElement("div");
      card.className="br-chrono-card";
      card.innerHTML=`
        <div class="v">${x.value}</div>
        <div class="p">${x.pattern}${x.note ? "<br>"+x.note : ""}</div>`;
      card.onclick=()=>{
        if(brOwned.has(x.id)) brOwned.delete(x.id);
        else brOwned.add(x.id);
        saveBrazil();
        renderBrazil();
      };
      brGrid.appendChild(card);
    });
  }

  const totalAll=brazilCoins.length+brazilNotes.length;
  const ownedValid=[...brOwned].filter(id=>brazilCoins.some(x=>x.id===id)||brazilNotes.some(x=>x.id===id)).length;
  brCount.textContent=ownedValid;
  brTotal.textContent=totalAll;
  brProgress.textContent=`${brState==="owned"?"Já tenho":"Faltam"}: ${missing.length} ${brTab==="coins"?"moedas":"cédulas"}`;
}

render();



</script>

  text-wrap:balance;
}

/* Mundo também aproveita mais o círculo */
.card{
  padding:7% !important;
}
.card .country{
  font-size:clamp(12px,3.2vw,17px) !important;

</style>

<script>
/* Quebras pensadas para aproveitar a largura dos círculos */
(function(){
  const originalRenderBrazil = renderBrazil;
  renderBrazil = function(){
    originalRenderBrazil();

    document.querySelectorAll(".br-chrono-card .v").forEach(el=>{
      let t=el.textContent.trim();
      const replacements = {
        "1.000 réis":"1.000<br>réis",
        "2.000 réis":"2.000<br>réis",
        "5.000 réis":"5.000<br>réis",
        "10.000 réis":"10.000<br>réis",
        "20.000 réis":"20.000<br>réis",
        "50.000 réis":"50.000<br>réis",
        "100.000 réis":"100.000<br>réis",
        "200.000 réis":"200.000<br>réis",
        "500.000 réis":"500.000<br>réis",
        "1 conto de réis":"1 conto<br>de réis"
      };
      if(replacements[t]) el.innerHTML=replacements[t];
      else {
        el.innerHTML=t
          .replace(/ (cruzeiros reais)$/i,"<br>$1")
          .replace(/ (cruzeiros novos)$/i,"<br>$1")
          .replace(/ (cruzeiros)$/i,"<br>$1")
          .replace(/ (cruzados novos)$/i,"<br>$1")
          .replace(/ (cruzados)$/i,"<br>$1")
          .replace(/ (centavos)$/i,"<br>$1");
      }
    });

    document.querySelectorAll(".br-chrono-card .p").forEach(el=>{
      let t=el.innerHTML;
      t=t
        .replace("Réis — Império","Réis<br>Império")
        .replace("Réis — República","Réis<br>República")
        .replace("Cruzeiro Novo","Cruzeiro<br>Novo")
        .replace("Cruzado Novo","Cruzado<br>Novo")
        .replace("Cruzeiro Real","Cruzeiro<br>Real")
        .replace("Real — comemorativas","Real<br>comemorativa");
      el.innerHTML=t;
    });
  };

  /* Re-render if Brazil is already visible */
  if(document.getElementById("brasilSection")?.classList.contains("active")){
    renderBrazil();
  }
})();
</script>

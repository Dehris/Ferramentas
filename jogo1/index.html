<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Imagem & Ação</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--card:#1c1c1c;--stroke:#2a2a2a;--accent:#ff7a00;--text:#f2f2f2;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Montserrat',sans-serif;color:var(--text);display:flex;justify-content:center;}
.container{width:100%;max-width:420px;padding:20px;}
h1{text-align:center;font-size:28px;font-weight:700;margin:10px 0 16px;}
.levels{display:flex;gap:8px;margin-bottom:16px;}
.levels button{flex:1;padding:8px;border-radius:12px;border:1px solid var(--stroke);background:#111;color:var(--text);font-weight:600;cursor:pointer;}
.levels button.active{background:var(--accent);color:#000;}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:16px;}
.row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.circle{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#000;font-weight:700;display:flex;align-items:center;justify-content:center;}
.circle.small{width:38px;height:38px;font-size:14px;}
.word{flex:1;background:#111;border:1px solid var(--stroke);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;}
.footer{margin-top:20px;}
.footer button{width:100%;padding:14px;font-size:16px;font-weight:700;border-radius:14px;border:none;cursor:pointer;background:var(--accent);color:#000;}
#timerWrap{margin-top:14px;text-align:center;}
#timer{font-size:22px;font-weight:700;color:var(--accent);margin-bottom:8px;}
#startTimerBtn{padding:8px 16px;border-radius:10px;border:1px solid var(--stroke);background:#111;color:var(--accent);font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="container">
<h1>Imagem & Ação</h1>

<div class="levels">
  <button onclick="setNivel('junior')" id="btn-junior">Júnior</button>
  <button onclick="setNivel('medio')" id="btn-medio" class="active">Médio</button>
  <button onclick="setNivel('hardcore')" id="btn-hardcore">Hardcore</button>
</div>

<div class="card" id="carta"></div>

<div class="footer">
  <button onclick="gerarCarta()">Gerar nova carta</button>
</div>

<div id="timerWrap">
  <div id="timer">60</div>
  <button id="startTimerBtn" onclick="startTimer()">Iniciar tempo</button>
</div>

</div>

// ===== JOGO =====
let nivelAtual = "medio";
let pools = {};

function resetPools(){
  pools = JSON.parse(JSON.stringify(dicionarios[nivelAtual]));
}

function shuffle(arr){
  return arr.sort(() => Math.random() - 0.5);
}

function pickUnique(cat){
  if(!pools[cat] || pools[cat].length === 0){
    pools[cat] = [...(dicionarios[nivelAtual][cat] || [])];
  }
  if(pools[cat].length === 0) return "---";
  const i = Math.floor(Math.random() * pools[cat].length);
  return pools[cat].splice(i,1)[0];
}

function setNivel(n){
  nivelAtual = n;
  document.querySelectorAll('.levels button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+n).classList.add('active');
  resetPools();
  gerarCarta();
}

function gerarCarta(){
  resetTimer();
  const categorias = ['P','O','A','D','L','M'];
  const pontos = shuffle([1,2,3,4,5,6]);
  const carta = document.getElementById('carta');
  carta.innerHTML = '';
  categorias.forEach((cat,i)=>{
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="circle">${cat}</div>
      <div class="word">${pickUnique(cat)}</div>
      <div class="circle small">${pontos[i]}</div>
    `;
    carta.appendChild(row);
  });
}

// ===== TIMER (CONTAGEM REGRESSIVA) =====
let timeLeft = TEMPO_INICIAL;
let timerInterval = null;

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 880;
    osc.connect(ctx.destination);
    osc.start();
    setTimeout(()=>osc.stop(),200);
  }catch(e){}
}

function vibrar(){
  if(navigator.vibrate){
    navigator.vibrate([200,100,200]);
  }
}

function startTimer(){
  if(timerInterval) return;
  timerInterval = setInterval(()=>{
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      timerInterval = null;
      document.getElementById('timer').textContent = '0';
      beep();
      vibrar();
    }
  },1000);
}

function resetTimer(){
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval = null;
  }
  timeLeft = TEMPO_INICIAL;
  document.getElementById('timer').textContent = TEMPO_INICIAL;
}

// INIT
resetPools();
gerarCarta();
</script>
